name: Publicar BNT Pelota en Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
      - name: Normalizar token de Cloudflare
        shell: bash
        env:
          TOKEN_CONFIGURADO: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TOKEN_LIMPIO="$(python3 - <<'PY'
          import os
          import re
          import sys
          raw = os.environ.get('TOKEN_CONFIGURADO','').strip()
          # Token directo, Bearer completo, o el comando de verificacion que Cloudflare ofrece copiar.
          matches = re.findall(r'Bearer\s+([A-Za-z0-9._~+=/\-]{30,})', raw, flags=re.I)
          if len(set(matches)) == 1:
              token = matches[0]
          else:
              token = re.sub(r'^CLOUDFLARE_API_TOKEN\s*=\s*', '', raw, flags=re.I)
              token = token.strip().strip('\"`\'').strip()
              token = re.sub(r'\s+', '', token)
          if not re.fullmatch(r'[A-Za-z0-9._~+=/\-]{30,}', token):
              print('El contenido guardado en GitHub no parece ser un token API de Cloudflare. Copia solo el codigo de token.',file=sys.stderr)
              sys.exit(1)
          sys.stdout.write(token)
          PY
          )"
          echo "::add-mask::$TOKEN_LIMPIO"
          printf 'CF_TOKEN_LIMPIO=%s\n' "$TOKEN_LIMPIO" >> "$GITHUB_ENV"
      - name: Publicar en el proyecto original bnt-pelota
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_TOKEN_LIMPIO }}
          accountId: 193486693c9ba649c47c57b9e550408f
          command: pages deploy public --project-name=bnt-pelota --branch=main
