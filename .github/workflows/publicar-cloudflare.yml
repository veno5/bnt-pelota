name: Publicar BNT Pelota en Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
      - name: Normalizar token de Cloudflare
        shell: bash
        env:
          TOKEN_CONFIGURADO: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TOKEN_LIMPIO="$(python3 - <<'PY'
          import os
          import re
          import sys
          raw = os.environ.get('TOKEN_CONFIGURADO','').strip()
          # Token directo, Bearer completo, o el comando de verificacion que Cloudflare ofrece copiar.
          matches = re.findall(r'Bearer\s+([A-Za-z0-9._~+=/\-]{30,})', raw, flags=re.I)
          if len(set(matches)) == 1:
              token = matches[0]
          else:
              token = re.sub(r'^CLOUDFLARE_API_TOKEN\s*=\s*', '', raw, flags=re.I)
              token = token.strip().strip('\"`\'').strip()
              token = re.sub(r'\s+', '', token)
          if not re.fullmatch(r'[A-Za-z0-9._~+=/\-]{30,}', token):
              print('El contenido guardado en GitHub no parece ser un token API de Cloudflare. Copia solo el codigo de token.',file=sys.stderr)
              sys.exit(1)
          sys.stdout.write(token)
          PY
          )"
          echo "::add-mask::$TOKEN_LIMPIO"
          printf 'CF_TOKEN_LIMPIO=%s\n' "$TOKEN_LIMPIO" >> "$GITHUB_ENV"
      - name: Recuperar el icono aprobado de BNT Pelota
        run: python3 scripts/recuperar_icono.py
      - name: Publicar en el proyecto original bnt-pelota
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_TOKEN_LIMPIO }}
          accountId: 193486693c9ba649c47c57b9e550408f
          command: pages deploy public --project-name=bnt-pelota --branch=main
      - name: Verificar registro y D1 (sin datos de clientes)
        shell: bash
        continue-on-error: true
        run: |
          for intento in 1 2 3 4 5; do
            RESPUESTA="$(curl -sS --max-time 12 https://bnt-pelota.pages.dev/api/health 2>&1)" || true
            echo "Intento $intento: $RESPUESTA"
            if printf '%s' "$RESPUESTA" | grep -q '"ok":true'; then
              echo "API DE REGISTRO: CORRECTA"
              exit 0
            fi
            sleep 4
          done
          echo "No se pudo verificar la API del registro"
      - name: Comprobar iconos Android iPhone y acceso gratuito
        shell: bash
        continue-on-error: true
        run: |
          set -e
          echo "Manifest:"
          curl -fsS --max-time 15 https://bnt-pelota.pages.dev/manifest.webmanifest | grep -q 'icon-512.png'
          echo "PNG de Android (192 y 512):"
          curl -fsSI --max-time 15 https://bnt-pelota.pages.dev/icon-192.png | grep -qi "content-type: image/png"
          curl -fsSI --max-time 15 https://bnt-pelota.pages.dev/icon-512.png | grep -qi "content-type: image/png"
          echo "PNG de iPhone (180):"
          curl -fsSI --max-time 15 https://bnt-pelota.pages.dev/apple-touch-icon.png | grep -qi "content-type: image/png"
          echo "Acceso anónimo sin permisos para Juegos:"
          curl -fsS --max-time 15 https://bnt-pelota.pages.dev/api/access | grep -q '"allowed":false'
          echo "Planes:"
          curl -fsS --max-time 15 https://bnt-pelota.pages.dev/api/status | grep -q '"monthly_usd":3'
          echo "ICONOS, ACCESO Y PLANES VERIFICADOS"
      - name: Guardar iconos originales para próximas actualizaciones
        shell: bash
        run: |
          git add public/icon-192.png public/icon-512.png public/apple-touch-icon.png public/favicon-64.png
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Guardar iconos originales BNT Pelota"
            git push
          fi
