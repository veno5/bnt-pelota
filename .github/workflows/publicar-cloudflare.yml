name: Publicar BNT Pelota en Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
      - name: Normalizar token de Cloudflare
        shell: bash
        env:
          TOKEN_CONFIGURADO: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TOKEN_LIMPIO="$(python3 - <<'PY'
          import os
          import re
          import sys
          token = os.environ.get('TOKEN_CONFIGURADO', '').strip()
          token = re.sub(r'^(?:Authorization\s*:\s*)?Bearer\s+', '', token, flags=re.I)
          token = re.sub(r'^CLOUDFLARE_API_TOKEN\s*=\s*', '', token, flags=re.I)
          token = token.strip().strip('"`\'').strip()
          token = re.sub(r'\s+', '', token)
          if not token or not re.fullmatch(r'[A-Za-z0-9._~+=/\-]+', token):
              print('El Secret CLOUDFLARE_API_TOKEN no tiene formato de token valido.', file=sys.stderr)
              sys.exit(1)
          sys.stdout.write(token)
          PY
          )"
          echo "::add-mask::$TOKEN_LIMPIO"
          printf 'CF_TOKEN_LIMPIO=%s\n' "$TOKEN_LIMPIO" >> "$GITHUB_ENV"
      - name: Publicar en el proyecto original bnt-pelota
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_TOKEN_LIMPIO }}
          accountId: 193486693c9ba649c47c57b9e550408f
          command: pages deploy public --project-name=bnt-pelota --branch=main
